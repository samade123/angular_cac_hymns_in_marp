<header class="header" [ngClass]="{'fullscreen': fullscreen}">
  <div class="header-path">
    <span>CAC Doc Viewer</span>
    <span class="opacity-30">/</span>
    <strong id="currentHymnTitle">{{selectedSimpleHymn ? selectedSimpleHymn.hymnNumber + ' - ' + selectedSimpleHymn.name
      :
      ''}}</strong>
  </div>
  <div class="header__right">
    <p-button [rounded]="false" icon="pi pi-window-maximize" [text]="false" size='small' iconPos="right"
      *ngIf="isHymnPage()" type="button" title="Present" label="Present" class="p-button-success"
      (onClick)="setFullScreen()"></p-button>
    <p-button (onClick)="op.toggle($event)" icon="pi pi-cog" size="small" />

    <p-overlayPanel #op>
      <div class="overlay-wrap">
        <h2>Settings</h2>

        <div class="settings-section">
          <h3>Status</h3>
          <div class="settings-row">
            <span>Data Freshness</span>
            <span class="val-accent">{{currentExpiry}}</span>
          </div>
        </div>

        <div class="settings-section">
          <h3>Themeing</h3>
          <div class="settings-row">
            <span>Dark/Light Mode</span>
            <p-toggleButton [(ngModel)]="darkMode" (onChange)="setColourTheme()" onIcon="pi pi-moon"
              offIcon="pi pi-sun" />
          </div>
        </div>

        <div class="settings-section">
          <h3>Presentation</h3>
          <div class="settings-row">
            <span>Font Size</span>
            <p-inputNumber inputId="font-size" />
          </div>
        </div>

        <div class="settings-section">
          <h3>Database</h3>
          <div class="settings-row">
            <span>Local Storage</span>
            <p-button (onClick)="getNotionResponse()" icon="pi pi-refresh" size="small" />
          </div>
        </div>
      </div>
    </p-overlayPanel>
  </div>
</header>
<aside [ngClass]="{'fullscreen': fullscreen}">
  <app-hymn-sidebar [simpleHymns]="hymnsList" (selectedHymnId)="selectHymnId($event)"
    (reload)="getNotionResponse()"></app-hymn-sidebar>
</aside>
<main id="main" [ngClass]="{'fullscreen': fullscreen}">
  <router-outlet />

</main>
