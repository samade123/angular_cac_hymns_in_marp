<div class="search-block">
  <i class="pi pi-search search-icon"></i>
  <input type="text" id="hymn-search-input" placeholder="Search by number or title..." [(ngModel)]="searchQuery"
    (ngModelChange)="queryDb()" (focus)="focusInput()" (blur)="loseFocus()" autocomplete="off">

  <div class="search-results-dropdown" [class.visible]="searchQuery.length > 0">
    <div class="hymn-select-item" *ngFor="let hymn of friends$ | async; index as i; trackBy: hymnTrackbyFn"
      (click)="pickHymn(hymn.id)" [class.kb-active]="activeIndex === i">
      <div class="hymn-select-item__number">{{hymn.hymnNumber}}</div>
      <div class="hymn-select-item__info">
        <h3 class="hymn-select-item__title">{{hymn.name}}</h3>
        <span class="hymn-select-item__author" *ngIf="hymn.author">{{hymn.author}}</span>
      </div>
      <div class="hymn-select-item__hint"><i class="pi pi-arrow-right"></i></div>
    </div>
  </div>
</div>

<section>
  <div class="sidebar-tabs">
    <div class="tab-item" *ngFor="let button of buttonFilters" [class.active]="button.selected"
      (click)='filterHymns(button)'>{{button.name}}</div>
  </div>
  <div class="hymn-list-wrapper" *ngIf="buttonFilters[0].selected else allHymns">
    <div class="zero-hymns" *ngIf="zeroHymns">
      <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
      <div class="zero-hymns__title">
        Loading Hymns...
      </div>
    </div>

    <div class="hymn-item-wrapper"
      *ngFor="let hymn of hymnItemsArr$ | async; index as i; trackBy: simpleHymnItemsTrackByFn">
      <app-hymn-sidebar-item [hymnItem]="hymn" [lastOpenedEnabled]="true" (click)="pickHymn(hymn.id)" />
    </div>
  </div>
  <ng-template #allHymns>
    <div class="hymn-list-wrapper">
      <div class="zero-hymns" *ngIf="zeroHymns">
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
        <div class="zero-hymns__title">
          Loading Hymns...
        </div>
      </div>
      <div class="hymn-item-wrapper" *ngFor="let hymn of allSimpleHymns$ | async; index as i; trackBy: hymnTrackbyFn">
        <app-hymn-sidebar-item [hymnItem]="hymn" [lastOpenedEnabled]="true" (click)="pickHymn(hymn.id)" />
      </div>
      <div class="hymn-paginator">
        <!-- <div class="hymn-paginator__left">
          <i class="pi pi-arrow-left"></i>
        </div>
        <div class="hymn-paginator__middle">

        </div>
        <div class="hymn-paginator__right">
          <i class="pi pi-arrow-right"></i>
        </div> -->

        <p-paginator (onPageChange)="onPageChange($event)" [first]="offset" [rows]="10" [totalRecords]="hymnsLength"
          [pageLinkSize]="3"></p-paginator>

      </div>
    </div>
  </ng-template>
</section>
